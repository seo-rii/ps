name: temp-malbolge-1000-verification

on:
  push:
    branches:
      - tmp-malbolge-1000-ci
    paths:
      - 'malbolge-1000.patch'
      - '.github/workflows/malbolge-1000-temp.yml'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and execute tests
        shell: bash
        run: |
          set +e
          (
            set -euxo pipefail
            sudo apt-get update
            sudo apt-get install -y flex bison libfl-dev
            rm -rf LMAO malbolge-interpreter
            git clone https://github.com/esoteric-programmer/LMAO.git LMAO
            git -C LMAO checkout 859dc1ebd191f09b18c0bd6adb9a9f9b2b02fe60
            make -C LMAO

            : > baseline.log
            ./LMAO/lmao -d -o baseline.mb LMAO/example_adder.hell 2>&1 | tee -a baseline.log
            wc -c baseline.mb baseline.mb.dbg 2>/dev/null | tee -a baseline.log || true
            python3 - <<'PY' | tee -a baseline.log
          p=open('baseline.mb','rb').read(); q=b''.join(p.split())
          print('baseline_non_whitespace_cells=',len(q))
          PY

            patch LMAO/example_adder.hell < malbolge-1000.patch
            : > assemble.log
            ./LMAO/lmao -d -o adder_0_to_1000.mb LMAO/example_adder.hell 2>&1 | tee -a assemble.log
            cp LMAO/example_adder.hell adder_0_to_1000.hell
            wc -c adder_0_to_1000.mb | tee -a assemble.log
            python3 - <<'PY' | tee -a assemble.log
          p = open('adder_0_to_1000.mb', 'rb').read()
          q = b''.join(p.split())
          print('non_whitespace_cells=', len(q))
          assert len(q) <= 59049, len(q)
          PY

            git clone --depth 1 https://github.com/TryItOnline/malbolge.git malbolge-interpreter
            gcc -O2 malbolge-interpreter/malbolge.c -o malbolge

            : > test.log
            run_case() {
              input="$1"
              expected="$2"
              echo "CASE: $input -> $expected" | tee -a test.log
              actual=$(printf '%s\n' "$input" | timeout 300 ./malbolge adder_0_to_1000.mb)
              status=$?
              printf '  exit=%s actual=<%s>\n' "$status" "$actual" | tee -a test.log
              if [ "$status" -ne 0 ] || [ "$actual" != "$expected" ]; then
                echo "FAILED" | tee -a test.log
                return 1
              fi
            }
            run_case '0 0' '0'
            run_case '1 2' '3'
            run_case '10 20' '30'
            run_case '999 999' '1998'
            run_case '10 1000' '1010'
            run_case '1000 10' '1010'
            run_case '0 1000' '1000'
            run_case '1000 0' '1000'
            run_case '999 1000' '1999'
            run_case '1000 999' '1999'
            run_case '1000 1000' '2000'
          ) > >(tee ci.log) 2>&1
          status=$?
          echo "$status" > ci-status.txt
          exit 0

      - name: Commit result to temporary branch
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf malbolge-ci-result
          mkdir -p malbolge-ci-result
          for f in baseline.mb baseline.mb.dbg baseline.log adder_0_to_1000.mb adder_0_to_1000.mb.dbg adder_0_to_1000.hell assemble.log test.log ci.log ci-status.txt; do
            if [ -f "$f" ]; then cp "$f" malbolge-ci-result/; fi
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add malbolge-ci-result
          git commit -m 'temp: Malbolge verification result [skip ci]' || exit 0
          git push origin HEAD:tmp-malbolge-1000-ci
